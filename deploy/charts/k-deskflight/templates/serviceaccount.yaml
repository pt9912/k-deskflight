{{- if .Values.serviceAccount.create -}}
---
# ServiceAccount für den Operator-Prozess (architecture.md AR-017).
# 1:1-Templating aus deploy/manifests/serviceaccount.yaml; Annotations
# über values.yaml.serviceAccount.annotations konfigurierbar (Default:
# leer).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k-deskflight.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "k-deskflight.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
