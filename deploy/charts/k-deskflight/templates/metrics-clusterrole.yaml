{{- if and .Values.metrics.enabled .Values.metrics.clusterRolePattern.create -}}
---
# Pattern-Asset-ClusterRole für Prometheus-/metrics-Scrape
# (slice-M6 §2.2.1). 1:1 aus deploy/manifests/metrics-clusterrole.yaml
# abgeleitet. Funktional nur wirksam, wenn der Operator-Endpoint
# authentisiert ausgeliefert wird (v0.2-Folge-ADR zu ADR 0007). Kein
# ClusterRoleBinding mitgeliefert — Monitoring-ServiceAccount ist
# stack-spezifisch.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k-deskflight-metrics-scrape
  # Labels bewusst inline gesetzt (nicht über `k-deskflight.labels`-
  # Helper), weil dieses Resource den Component-Wert
  # `metrics-scrape` statt `operator` führt — der Helper-Pfad würde
  # beide Werte ins YAML schreiben (Duplicate-Key-Drift gegen
  # deploy/manifests/metrics-clusterrole.yaml).
  labels:
    app.kubernetes.io/name: k-deskflight
    app.kubernetes.io/component: metrics-scrape
    app.kubernetes.io/part-of: k-deskflight
rules:
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
{{- end }}
