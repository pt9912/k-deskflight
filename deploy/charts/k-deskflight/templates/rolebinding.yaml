{{- if and .Values.rbac.create (eq .Values.operator.mode "namespace-scope") -}}
---
# Namespace-scope RoleBinding (architecture.md AR-017).
# 1:1 aus deploy/manifests/rolebinding.yaml abgeleitet. Wird nur
# gerendert wenn operator.mode == "namespace-scope".
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k-deskflight-operator
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "k-deskflight.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k-deskflight-operator-namespace
subjects:
  - kind: ServiceAccount
    name: {{ include "k-deskflight.serviceAccountName" . }}
    namespace: {{ .Values.namespace.name }}
{{- end }}
