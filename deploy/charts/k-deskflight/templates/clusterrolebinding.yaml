{{- if .Values.rbac.create -}}
---
# ClusterRoleBinding für den Cluster-Wide Mode (architecture.md AR-017).
# Bindet die ClusterRole `k-deskflight-operator-cluster` aus
# clusterrole.yaml an den Operator-SA aus serviceaccount.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k-deskflight-operator
  labels:
    {{- include "k-deskflight.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k-deskflight-operator-cluster
subjects:
  - kind: ServiceAccount
    name: {{ include "k-deskflight.serviceAccountName" . }}
    namespace: {{ .Values.namespace.name }}
{{- end }}
