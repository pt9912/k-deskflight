{{- if .Values.rbac.create -}}
---
# ClusterRole für den Operator (architecture.md AR-015, MVP-Minimum).
# Quelle: config/rbac/role.yaml (controller-gen-Output aus den
# `+kubebuilder:rbac:`-Markern am Reconcile-Receiver). Drift-Detektion
# zwischen Chart-Template und controller-gen-Output erfolgt via
# `make helm-manifests-sync` (slice-M8 §2.5, Aktivierung in Step 5).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k-deskflight-operator-cluster
  # Labels bewusst ausgelassen, damit der Chart-Render 1:1 zum
  # controller-gen-Output in config/rbac/role.yaml passt (drift-frei
  # gegen `kubectl kustomize deploy/manifests/`). Wenn der
  # controller-gen-Output später Labels bekommt (z. B. via
  # +kubebuilder:metadata-Marker), beide Seiten synchron anpassen.
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
- apiGroups:
  - authorization.k8s.io
  resources:
  - selfsubjectaccessreviews
  - selfsubjectrulesreviews
  verbs:
  - create
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - k-deskflight.geo-terrain.net
  resources:
  - opendeskpreflightchecks
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - k-deskflight.geo-terrain.net
  resources:
  - opendeskpreflightchecks/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - networking.k8s.io
  resources:
  - ingressclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - watch
{{- end }}
