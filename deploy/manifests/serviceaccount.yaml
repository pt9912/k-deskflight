---
# ServiceAccount für den Operator-Prozess (architecture.md AR-017).
# Bindet an die ClusterRole `k-deskflight-operator-cluster` aus
# config/rbac/role.yaml via ClusterRoleBinding (clusterrolebinding.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k-deskflight-operator
  namespace: k-deskflight-system
  labels:
    app.kubernetes.io/name: k-deskflight
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: k-deskflight
