---
# kustomize-Basis für `kubectl apply -k deploy/manifests/`.
# Bündelt die rohen Manifeste (architecture.md AR-019/AR-020,
# ADR 0005: kein Helm Chart im MVP). CRD und ClusterRole werden
# aus den controller-gen-Outputs (config/) referenziert.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../../config/crd/k-deskflight.geo-terrain.net_opendeskpreflightchecks.yaml
  - ../../config/rbac/role.yaml
  - serviceaccount.yaml
  - clusterrolebinding.yaml
  - deployment.yaml
  # slice-M6 §2.2: /metrics-Endpoint via Service exposed +
  # ClusterRole-Pattern-Asset für künftige Auth-Filter-Aktivierung.
  - service.yaml
  - metrics-clusterrole.yaml
# Hinweis: `role.yaml` und `rolebinding.yaml` (slice-M8 §2.3) sind
# bewusst NICHT in der Default-Basis enthalten — sie liefern den
# optionalen Namespace-Reconcile-Scope Mode (AR-016 / AR-017) und
# werden nur aktiviert, wenn der Operator mit `--namespace=…` läuft.
# Aktivierung: `kubectl apply -f role.yaml -f rolebinding.yaml`
# zusätzlich zum `kubectl apply -k .` (Cluster-Wide-Basis bleibt).
# Im Helm-Chart wird derselbe Schalter via `values.yaml.operator.mode`
# bedient (slice-M8 §2.3-Begründung).
