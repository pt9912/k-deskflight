name: ci

# Zwei parallele Jobs gemäß ADR 0012 §2.11:
#   - gates           : Inner-Loop-Pflichten (lint, test, coverage-gate,
#                       doc-refs) — `make gates`.
#   - security-gates  : Externe Gates (govulncheck) — `make security-gates`.
#
# Beide Jobs sind PR-blockierend (Required-Status-Checks-Konfiguration
# erfolgt im GitHub-UI nach dem ersten grünen Lauf). Docker-only-Pfad:
# alle Werkzeuge laufen über `docker build --target <stage>`, sodass die
# CI-Runner keine Go-Toolchain installieren muss — sie braucht nur das
# vorinstallierte Docker + BuildKit auf ubuntu-latest.
#
# DCO-Bot-Aktivierung ist Folgepflicht im GitHub-UI (ADR 0011 §2.4) und
# läuft nicht als Workflow-Step.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Top-level permissions: explizit alles entziehen, jeder Job lockert
# auf das, was er braucht (Defense-in-Depth gegen versehentlich neu
# hinzukommende Steps, die schreibende Tokens nutzen würden).
permissions: {}

jobs:
  gates:
    name: gates (build + lint + test + coverage-gate + doc-refs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      # SHA-Pin auf v4.2.2 (Supply-Chain-Härtung gegen Tag-Move). Pin-
      # Hebung ist Routine; neuen Commit-SHA via
      # `gh api repos/actions/checkout/git/refs/tags/<tag>` auflösen
      # und Tag-Kommentar mitführen.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run make gates
        run: make gates

  security-gates:
    name: security-gates (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run make security-gates
        run: make security-gates
