name: cluster-smoke

# Cluster-Smoke gegen kind (ADR 0013). Trigger nur auf push:main und
# manuell (workflow_dispatch). NICHT auf pull_request, weil der Lauf
# 60–90 s Build + Cluster-Setup kostet und kein PR-Pfad-Pflicht-Gate
# ist (ADR 0013 §2.5). Pflicht-Gates aus ADR 0012 §2.11 laufen
# weiterhin in `.github/workflows/ci.yml`.
#
# Tooling (kind + kubectl + docker-cli) lebt in der `smoke`-Dockerfile-
# Stage; der Workflow installiert keine externen Actions außer
# `actions/checkout`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    # Slice-M8 §2.7: Matrix-Dimension `install-mode` fährt manifests-
    # und helm-Pfad parallel. Beide installieren denselben Operator,
    # nur die Distribution (kubectl-kustomize vs. helm install) ist
    # unterschiedlich; die Phasen-Assertions sind identisch.
    name: cluster-smoke (kind + ${{ matrix.install-mode }})
    strategy:
      fail-fast: false
      matrix:
        install-mode: [manifests, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cluster-smoke (${{ matrix.install-mode }})
        run: make cluster-smoke INSTALL_MODE=${{ matrix.install-mode }}

      - name: Upload attest artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Artefakt-Name pro Modus, sonst Upload-Kollision.
          name: cluster-smoke-attest-${{ matrix.install-mode }}
          path: |
            .cluster-smoke-attest.yaml
          if-no-files-found: ignore
          retention-days: 30
