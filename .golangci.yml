# golangci-lint configuration for k-deskflight (v2-Schema).
#
# Bezug:
#   - ADR 0012 §2.2 — 5 Default-Linter + 24 SOLID-nahe Linter (Pflicht).
#   - ADR 0012 §2.3 — forbidigo-Startverbote (fmt.Print*, panic(...)).
#   - ADR 0012 §2.4 — Suppressions-Verbot: //nolint-Pragmas sind
#     verboten. Carveouts werden zentral hier dokumentiert
#     (`Why:`-Kommentar Pflicht).
#   - ADR 0012 §2.6 + architecture.md AR-005 — depguard-Layer-Regeln.
#
# Slice M1 (siehe slice-M1-repo-skeleton.md §2.3): das Profil ist hier
# vollständig aktiv, depguard ist enabled aber mit leerem `rules`-Map —
# die fünf konkreten Layer-Regelblöcke kommen in M2, sobald
# internal/hexagon/* und api/v1alpha1/* Inhalte haben.

version: "2"
linters:
  default: none
  enable:
    # 5 Default-Linter (ADR 0012 §2.2)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # 24 SOLID-nahe Linter (ADR 0012 §2.2)
    - containedctx
    - contextcheck
    - cyclop
    - depguard
    - dupl
    - fatcontext
    - forbidigo
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocyclo
    - gomodguard_v2
    - iface
    - inamedparam
    - interfacebloat
    - ireturn
    - maintidx
    - nestif
    - noctx
    - reassign
    - revive
    - testpackage
    - unparam
  settings:
    cyclop:
      max-complexity: 15
    depguard:
      # Why: Layer-Regeln gemäß architecture.md AR-005 (M2 Step 1+2).
      # `list-mode: lax` heißt: jede Regel filtert nur Dateien, die in
      # ihrer `files:`-Liste matchen — andere Dateien (cmd/operator,
      # api/v1alpha1) sind von der jeweiligen Regel ungesehen. Mit
      # ≥1 Regel verschwindet auch die golangci-lint-v2-Default-Deny-
      # Liste „Main", die bei `rules: {}` greift.
      rules:
        domain-isolation:
          list-mode: lax
          files:
            - '**/internal/hexagon/domain/**'
          deny:
            - pkg: k8s.io
              desc: domain layer must not depend on Kubernetes libraries (use port)
            - pkg: sigs.k8s.io
              desc: domain layer must not depend on controller-runtime
            - pkg: github.com/pt9912/k-deskflight/internal/hexagon/application
              desc: domain must not depend on application (AR-004)
            - pkg: github.com/pt9912/k-deskflight/internal/hexagon/port
              desc: domain must not depend on port (AR-004)
            - pkg: github.com/pt9912/k-deskflight/internal/adapter
              desc: domain must not depend on adapter (AR-004)
        application-no-adapter:
          list-mode: lax
          files:
            - '**/internal/hexagon/application/**'
          deny:
            - pkg: github.com/pt9912/k-deskflight/internal/adapter
              desc: application must depend on ports, not on adapter implementations (AR-004)
        port-no-application:
          list-mode: lax
          files:
            - '**/internal/hexagon/port/**'
          deny:
            - pkg: github.com/pt9912/k-deskflight/internal/hexagon/application
              desc: ports are abstractions, must not depend on application (AR-004)
            - pkg: github.com/pt9912/k-deskflight/internal/adapter
              desc: ports define abstractions, must not depend on adapter implementations (AR-004)
        adapter-no-application:
          list-mode: lax
          files:
            - '**/internal/adapter/**'
          deny:
            - pkg: github.com/pt9912/k-deskflight/internal/hexagon/application
              desc: adapter implements port, must not call into application directly (AR-004)
        api-no-internal:
          list-mode: lax
          files:
            - '**/api/v1alpha1/**'
          deny:
            - pkg: github.com/pt9912/k-deskflight/internal/hexagon
              desc: api/v1alpha1 declares CRD types only — must not depend on internal/* (AR-004)
    dupl:
      threshold: 150
    forbidigo:
      # Why: forbidigo ist kontextfrei (ADR 0012 §2.3.1) — `panic(...)`
      # wird global gebannt, weil eine Scope-Begrenzung auf „außerhalb
      # init()" mit diesem Linter nicht ausdrückbar ist. Tests sind
      # über die _test.go$-Exclusion unten ausgenommen; künftige
      # init()-Pfade brauchen einen pfad-genauen Carveout mit `Why:`
      # (kein //nolint-Pragma, LH-QG-010).
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: 'use log/slog with context (ADR 0012 §2.3, LH-NF-009)'
        - pattern: ^panic\(.*\)$
          msg: 'reconcile paths must return errors, not panic (ADR 0012 §2.3.1, LH-NF-004, LH-AK-010)'
    funlen:
      lines: 100
      statements: 60
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 15
    interfacebloat:
      max: 10
    ireturn:
      # Why: Adapter/Application müssen Domain- und Port-Interfaces
      # zurückgeben können (architecture.md AR-013 Resolve, AR-014
      # Aggregator). Konkrete Typen wären eine Layer-Verletzung.
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
        - github.com/pt9912/k-deskflight/internal/hexagon/domain\..*
        - github.com/pt9912/k-deskflight/internal/hexagon/port\..*
    maintidx:
      under: 20
    nestif:
      min-complexity: 5
  exclusions:
    generated: lax
    rules:
      # Why: Tests dürfen tiefer verschachteln, höhere Komplexität und
      # context-lose Aufrufe verwenden — Test-Strukturen folgen anderen
      # Lesbarkeits-Trade-offs (table-driven, sub-tests).
      - linters:
          - cyclop
          - gocognit
          - gocyclo
          - nestif
          - noctx
          - unparam
        path: _test\.go$
      # Why: Test-Code darf revive `unused-parameter` ignorieren —
      # Test-Helpers nehmen häufig benannte Parameter zur Lesbarkeit
      # auch ohne Use entgegen.
      - linters:
          - revive
        path: _test\.go$
        text: ^unused-parameter
      # Why: Tests müssen panicken dürfen (assert.PanicsWithError &
      # ähnliche Patterns); fmt.Println im Test-Trace ist OK, wenn man
      # `go test -v` parst.
      - linters:
          - forbidigo
        path: _test\.go$
      # Why: Bootstrap-Skripte (`scripts/coverage-overview` o. ä.)
      # leben außerhalb des Reconcile-Pfads; relaxierte Schwellen sind
      # vertretbar. Aktuell kein Inhalt — Eintrag steht vorab, bevor
      # Skripte in M6/M7 dazukommen.
      - linters:
          - cyclop
          - forbidigo
          - gocognit
          - gocyclo
        path: scripts/
      # Why: api/v1alpha1/ folgt dem k8s-Standard-Pattern (architecture.md
      # AR-006): drei Package-Level-Vars (GroupVersion, SchemeBuilder,
      # AddToScheme) sind im Ökosystem unverhandelbar. Wir nutzen
      # apimachinery's runtime.NewSchemeBuilder-Pattern statt
      # controller-runtime/pkg/scheme.Builder (deprecated SA1019), damit
      # ist ein `init()` nicht mehr nötig — gochecknoinits bleibt also
      # wirksam und ist hier nicht im Carveout.
      - linters:
          - gochecknoglobals
        path: api/v1alpha1/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
