---
# Minimal-CR mit dem ersten echten Check (KubernetesVersion).
# Schema-Defaults greifen für Profile (production) und für die Min-
# Version (1.34 per ADR 0009 §2.2); das `kubernetesVersion`-Sub-
# Objekt muss aber explizit gesetzt sein, damit der Reconciler den
# Check aktiviert.
apiVersion: k-deskflight.geo-terrain.net/v1alpha1
kind: OpenDeskPreflightCheck
metadata:
  name: smoke
  namespace: default
spec:
  profile: production
  checks:
    kubernetesVersion:
      min: "1.34"
